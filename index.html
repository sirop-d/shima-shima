<style>
:root{
  --bg:#faf9f6; --ink:#1c1b19; --gray:#8e8a82; --faint:#b8b4aa; --hairline:#e3e0d8;
  --serif:"Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --sans:"Helvetica Neue",Helvetica,"Hiragino Sans",Arial,sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{background:var(--bg);}
body{font-family:var(--sans); color:var(--ink); line-height:1.8; -webkit-font-smoothing:antialiased;}
button{background:none; border:none; cursor:pointer; font:inherit; color:inherit; padding:0;}
select{
  appearance:none; -webkit-appearance:none; border:none; background:transparent;
  font:inherit; color:var(--ink); cursor:pointer; border-radius:0;
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="8" height="5"><path d="M0 0l4 5 4-5z" fill="%238e8a82"/></svg>');
  background-repeat:no-repeat; background-position:right center; padding-right:18px;
}
header{
  display:flex; align-items:baseline; justify-content:space-between;
  padding:34px 48px 30px; border-bottom:1px solid var(--hairline);
}
.wordmark{font-size:13px; letter-spacing:.38em; font-weight:400;}
.hright{display:flex; align-items:baseline; gap:30px;}
nav{display:flex; gap:26px;}
nav button{
  font-size:11px; letter-spacing:.22em; color:var(--gray);
  padding-bottom:3px; border-bottom:1px solid transparent;
}
nav button.on{color:var(--ink); border-bottom-color:var(--ink);}
#langSel{font-size:10px; letter-spacing:.2em; color:var(--gray);}
main{max-width:1020px; margin:0 auto; padding:64px 48px 80px;}
.sim{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:72px; align-items:start;}
@media (max-width:760px){
  header{padding:24px 24px 20px; flex-wrap:wrap; gap:14px;}
  main{padding:40px 24px 64px;}
  .sim{grid-template-columns:1fr; gap:48px;}
}
.stage svg{display:block; width:100%; max-width:480px; margin:0 auto;}
.caption{text-align:center; margin-top:28px;}
.caption .name{font-family:var(--serif); font-size:15px; letter-spacing:.08em;}
.caption .spec{font-size:10px; letter-spacing:.3em; color:var(--faint); margin-top:6px;}
.capbtns{display:flex; gap:24px; justify-content:center; margin-top:20px;}
.capbtns button, .favtools button{
  font-size:10px; letter-spacing:.2em; color:var(--gray);
  border-bottom:1px solid transparent; padding-bottom:2px;
}
.capbtns button:hover, .favtools button:hover{color:var(--ink); border-bottom-color:var(--ink);}
.ctrl h2{
  font-size:10px; font-weight:400; letter-spacing:.3em; color:var(--gray);
  text-transform:uppercase; margin-bottom:14px;
}
.ctrl section{padding:26px 0; border-bottom:1px solid var(--hairline);}
.ctrl section:first-child{padding-top:0;}
#modelSel{
  width:100%; font-size:13.5px; letter-spacing:.05em;
  border-bottom:1px solid var(--hairline); padding:6px 18px 6px 0;
}
.model-note{font-size:11px; color:var(--faint); margin-top:12px; line-height:1.7;}
.dots{display:flex; flex-wrap:wrap; gap:14px; padding:2px; align-items:center;}
.dots button{
  width:22px; height:22px; border-radius:50%; border:1px solid var(--hairline);
}
.dots button.on{outline:1px solid var(--ink); outline-offset:3px;}
.dots .addc{
  font-size:14px; color:var(--gray); line-height:1; background:transparent;
  display:flex; align-items:center; justify-content:center;
}
.dots .addc:hover{color:var(--ink); border-color:var(--gray);}
#myColors{margin-top:12px;}
.pickers{display:flex; align-items:center; gap:14px; margin-top:22px;}
.pickers label{font-size:11px; color:var(--gray); letter-spacing:.08em;}
input[type=color]{
  -webkit-appearance:none; appearance:none; width:24px; height:24px; padding:0;
  border:1px solid var(--hairline); border-radius:50%; background:none; cursor:pointer;
}
input[type=color]::-webkit-color-swatch-wrapper{padding:0;}
input[type=color]::-webkit-color-swatch{border:none; border-radius:50%;}
#swap{
  margin-left:auto; font-size:11px; letter-spacing:.14em; color:var(--gray);
  border-bottom:1px solid transparent; padding-bottom:2px;
}
#swap:hover{color:var(--ink); border-bottom-color:var(--ink);}
.slider-row{display:flex; align-items:center; gap:16px; margin:16px 0;}
.slider-row label{font-size:11px; color:var(--gray); letter-spacing:.08em; min-width:64px;}
.slider-row output{font-size:12px; min-width:22px; text-align:right; font-variant-numeric:tabular-nums;}
input[type=range]{
  -webkit-appearance:none; appearance:none; flex:1; height:1px;
  background:var(--hairline); outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:11px; height:11px; border-radius:50%;
  background:var(--ink); border:none; cursor:pointer;
}
input[type=range]::-moz-range-thumb{
  width:11px; height:11px; border-radius:50%; background:var(--ink); border:none; cursor:pointer;
}
.footnote{font-size:10.5px; color:var(--faint); line-height:1.7; padding-top:24px;}
.favhead{display:flex; align-items:baseline; justify-content:space-between; max-width:720px; margin:0 auto 8px; gap:20px; flex-wrap:wrap;}
.favhead h2{font-size:10px; font-weight:400; letter-spacing:.3em; color:var(--gray); text-transform:uppercase;}
.favtools{display:flex; gap:20px; align-items:baseline;}
#sortSel{font-size:10.5px; letter-spacing:.12em; color:var(--gray);}
#sharedBar{
  max-width:720px; margin:0 auto 8px; display:flex; gap:20px; align-items:baseline;
  font-size:11px; color:var(--gray); letter-spacing:.08em; padding:10px 0;
  border-bottom:1px solid var(--hairline);
}
#sharedBar button{
  font-size:10px; letter-spacing:.18em; color:var(--gray);
  border-bottom:1px solid transparent; padding-bottom:2px;
}
#sharedBar button:hover{color:var(--ink); border-bottom-color:var(--ink);}
#favList{max-width:720px; margin:0 auto;}
.fav{display:flex; align-items:center; gap:18px; padding:20px 0; border-bottom:1px solid var(--hairline);}
.fav .grip{color:var(--faint); font-size:14px; cursor:grab; user-select:none;}
.fav .sw{width:46px; height:46px; border:1px solid var(--hairline); cursor:pointer; flex-shrink:0;}
.fav .info{flex:1; min-width:0; cursor:pointer;}
.fav .nm{font-size:12.5px; letter-spacing:.1em; display:flex; align-items:baseline; gap:10px;}
.fav .nm input{
  border:none; border-bottom:1px solid var(--hairline); background:transparent;
  font:inherit; outline:none; width:100%; max-width:260px; padding:0;
}
.fav .ren{font-size:11px; color:var(--faint);}
.fav .ren:hover{color:var(--ink);}
.fav .sp{font-size:9.5px; letter-spacing:.24em; color:var(--faint); margin-top:3px;}
.fav .dt{font-size:9.5px; letter-spacing:.12em; color:var(--faint); margin-top:3px;}
.fav .stars{display:flex; gap:3px;}
.fav .stars button, .fav .stars span{font-size:13px; color:var(--faint); line-height:1;}
.fav .stars .on{color:var(--ink);}
.fav .ud{display:flex; flex-direction:column; gap:6px;}
.fav .ud button{font-size:8px; color:var(--faint); line-height:1;}
.fav .ud button:hover{color:var(--ink);}
.fav .del{font-size:14px; color:var(--faint); padding:0 2px;}
.fav .del:hover{color:var(--ink);}
.fav.dragover{border-top:1px solid var(--ink);}
.empty{max-width:720px; margin:48px auto; text-align:center; font-size:12px; color:var(--faint); letter-spacing:.08em;}
article{max-width:620px; margin:0 auto;}
article .lede{font-family:var(--serif); font-size:16px; line-height:2.2; margin-bottom:48px;}
article h2{
  font-size:10px; font-weight:400; letter-spacing:.3em; color:var(--gray);
  text-transform:uppercase; margin:56px 0 18px; padding-top:32px; border-top:1px solid var(--hairline);
}
article h2:first-of-type{margin-top:0; padding-top:0; border-top:none;}
article p{font-family:var(--serif); font-size:14.5px; line-height:2.2; margin-bottom:16px;}
article .people{list-style:none;}
article .people li{margin-bottom:18px;}
article .people .who{font-family:var(--sans); font-size:12px; letter-spacing:.12em; display:block;}
article .people .what{font-family:var(--serif); font-size:13.5px; line-height:2; color:#46443f;}
article .tl{list-style:none;}
article .tl li{display:flex; gap:20px; margin-bottom:14px;}
article .tl .y{font-size:11px; letter-spacing:.1em; color:var(--gray); min-width:64px; padding-top:4px;}
article .tl .t{font-family:var(--serif); font-size:13.5px; line-height:2; flex:1;}
article .src{font-size:11px; color:var(--faint); line-height:1.9;}
article a{color:var(--gray);}
footer{text-align:center; font-size:9px; letter-spacing:.3em; color:var(--faint); padding:48px 0 40px;}
.hidden{display:none !important;}
</style>
</head>

<header>
  <p class="wordmark">shima-shima</p>
  <div class="hright">
    <nav>
      <button id="tabSim" class="on" data-view="sim">simulator</button>

    <select id="langSel" aria-label="language">

      <option value="en">EN</option>
      <option value="fr">FR</option>

  </div>
</header>

      <g clip-path="url(#tee)">
        <rect x="20" y="60" width="420" height="370" fill="url(#st)"></rect>
        <rect id="plainRect" x="20" y="60" width="420" height="0" fill="#F2EDE0"></rect>
      </g>

      <path d="M185,82 Q230,106 275,82" fill="none" stroke="#d8d3c8" stroke-width="1"></path>
    </svg>
    <div class="caption">
      <p class="name" id="modelName"></p>
      <p class="spec" id="specLine"></p>
      <div class="capbtns">
        <button id="todayBtn"></button>
        <button id="shareBtn"></button>
        <button id="dlTeeBtn"></button>
        <button id="addFav"></button>
      </div>
    </div>
  </div>

  <div class="ctrl">
    <section>
      <h2 id="hModel">model</h2>
      <select id="modelSel"></select>
      <p class="model-note" id="modelNote"></p>
    </section>

    <section>
      <h2 id="hColor">colorway</h2>
      <div class="dots" id="palettes"></div>
      <div class="dots" id="myColors"></div>
      <div class="pickers">
        <label id="lbBase" for="base"></label><input type="color" id="base" value="#F2EDE0">
        <label id="lbStripe" for="stripe"></label><input type="color" id="stripe" value="#1F2A44">

    </section>

    <section style="border-bottom:none;">
      <h2 id="hStripe">stripe</h2>

      </div>
      <div class="slider-row">
        <label id="lbGw" for="gw"></label>
        <input type="range" id="gw" min="2" max="32" step="1" value="8">
        <output id="gwOut">8</output>
      </div>
      <div class="slider-row">
        <label id="lbPl" for="pl"></label>
        <input type="range" id="pl" min="0" max="160" step="1" value="0">
        <output id="plOut">0</output>
      </div>
      <p class="footnote" id="footnote"></p>
    </section>
  </div>
</section>

<section id="viewFav" class="hidden">
  <div class="favhead">
    <h2 id="favTitle">favorites</h2>
    <div class="favtools" id="favTools">
      <select id="sortSel"></select>
    </div>
  </div>
  <div id="sharedBar" class="hidden">
    <span id="sharedMsg"></span>
    <button id="importBtn"></button>
    <button id="closeShared"></button>
  </div>
  <div id="favList"></div>
</section>

<section id="viewJour" class="hidden">
  <article id="journal"></article>
</section>
</main>

<footer>shima-shima by sirop</footer>

let lang = "ja";
let currentModel = MODELS[0];
let favs = [];
let myColors = [];
let sortMode = 0;
let sharedFavs = null;
let captionOverride = null;
let dragId = null;

function t(){ return I18N[lang]; }
const collator = new Intl.Collator(["ja"], {numeric:true, sensitivity:"base"});
const dispName = f => f.name || t().models[f.model] || f.model;

const b64e = s => btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const b64d = s => {
  s = s.replace(/-/g,"+").replace(/_/g,"/");
  while(s.length % 4) s += "=";
  return new TextDecoder().decode(Uint8Array.from(atob(s), c => c.charCodeAt(0)));
};
const pageUrl = () => location.href.split("#")[0];

function render(){
  const b = $("base").value, s = $("stripe").value;
  const sw = +$("sw").value, gw = +$("gw").value, pl = +$("pl").value;
  $("st").setAttribute("height", sw + gw);
  $("pBase").setAttribute("height", sw + gw);
  $("pBase").setAttribute("fill", b);
  $("pStripe").setAttribute("height", sw);
  $("pStripe").setAttribute("fill", s);
  $("plainRect").setAttribute("fill", b);
  $("plainRect").setAttribute("height", pl ? 60 + pl : 0);
  $("swOut").textContent = sw;
  $("gwOut").textContent = gw;
  $("plOut").textContent = pl;
  $("specLine").textContent = `STRIPE ${sw} · GAP ${gw} · PLAIN ${pl}`;
  $("modelName").textContent = captionOverride || t().models[currentModel.id];
  markPalette();
  saveState();
}

function markPalette(){
  const b = $("base").value.toUpperCase(), s = $("stripe").value.toUpperCase();
  const mark = (sel, arr) => document.querySelectorAll(sel).forEach((btn, i) => {
    const p = arr[i];
    if(!p) return;
    btn.classList.toggle("on", p.base.toUpperCase() === b && p.stripe.toUpperCase() === s);
  });
  mark("#palettes button", PALETTES);
  mark("#myColors button:not(.addc)", myColors);
}

function applyModel(m, keepValues){
  currentModel = m;
  captionOverride = null;
  if(!keepValues){
    $("sw").value = m.sw; $("gw").value = m.gw; $("pl").value = m.pl;
    $("base").value = m.base; $("stripe").value = m.stripe;
  }
  $("modelSel").value = m.id;
  $("modelNote").textContent = t().notes[m.id];
  render();
}

function buildModelSel(){
  const sel = $("modelSel");
  sel.innerHTML = "";
  MODELS.forEach(m => {
    const o = document.createElement("option");
    o.value = m.id;
    o.textContent = t().models[m.id];
    sel.appendChild(o);
  });
  sel.value = currentModel.id;
}

$("modelSel").addEventListener("change", e => {
  applyModel(MODELS.find(m => m.id === e.target.value));
});

const palBox = $("palettes");
PALETTES.forEach(p => {
  const btn = document.createElement("button");
  btn.style.background = `linear-gradient(135deg, ${p.base} 50%, ${p.stripe} 50%)`;
  btn.setAttribute("aria-label", `${p.base} / ${p.stripe}`);
  btn.addEventListener("click", () => {
    $("base").value = p.base;
    $("stripe").value = p.stripe;
    captionOverride = null;
    render();
  });
  palBox.appendChild(btn);
});

function renderMyColors(){
  const box = $("myColors");
  box.innerHTML = "";
  myColors.forEach((p, i) => {
    const btn = document.createElement("button");
    btn.style.background = `linear-gradient(135deg, ${p.base} 50%, ${p.stripe} 50%)`;
    btn.title = t().myColorTip;
    btn.setAttribute("aria-label", `${p.base} / ${p.stripe}`);
    btn.addEventListener("click", () => {
      $("base").value = p.base;
      $("stripe").value = p.stripe;
      captionOverride = null;
      render();
    });
    btn.addEventListener("dblclick", () => {
      myColors.splice(i, 1);
      saveMyColors();
      renderMyColors();
      markPalette();
    });
    box.appendChild(btn);
  });
  const add = document.createElement("button");
  add.className = "addc";
  add.textContent = "+";
  add.title = t().myColorAdd;
  add.setAttribute("aria-label", t().myColorAdd);
  add.addEventListener("click", () => {
    const b = $("base").value, s = $("stripe").value;
    if(!myColors.some(p => p.base.toUpperCase() === b.toUpperCase() && p.stripe.toUpperCase() === s.toUpperCase())){
      myColors.push({base: b, stripe: s});
      saveMyColors();
      renderMyColors();
      markPalette();
    }
  });
  box.appendChild(add);
}

$("swap").addEventListener("click", () => {
  const b = $("base").value;
  $("base").value = $("stripe").value;
  $("stripe").value = b;
  render();
});

["base","stripe","sw","gw","pl"].forEach(id => $(id).addEventListener("input", () => {
  captionOverride = null;
  render();
}));

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let x = Math.imul(a ^ a >>> 15, 1 | a);
    x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x;
    return ((x ^ x >>> 14) >>> 0) / 4294967296;
  };
}

$("todayBtn").addEventListener("click", () => {
  const now = new Date();
  const seed = now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate();
  const rng = mulberry32(seed);
  let base = TODAY_LIGHTS[Math.floor(rng() * TODAY_LIGHTS.length)];
  let stripe = TODAY_DARKS[Math.floor(rng() * TODAY_DARKS.length)];
  if(rng() < 0.15){ const tmp = base; base = stripe; stripe = tmp; }
  const sw = 3 + Math.floor(rng() * 12);
  const gw = 4 + Math.floor(rng() * 17);
  const pl = rng() < 0.15 ? 60 + Math.floor(rng() * 60) : 0;
  currentModel = MODELS.find(m => m.id === "original");
  $("modelSel").value = "original";
  $("modelNote").textContent = t().notes.original;
  $("base").value = base; $("stripe").value = stripe;
  $("sw").value = sw; $("gw").value = gw; $("pl").value = pl;
  const pad = n => String(n).padStart(2, "0");
  captionOverride = `${t().todayName} — ${pad(now.getMonth()+1)}.${pad(now.getDate())}`;
  render();
});

function copyText(url, btn){
  const done = () => {
    const orig = btn.dataset.label;
    btn.textContent = t().copied;
    setTimeout(() => { btn.textContent = orig; }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(done, () => window.prompt("URL", url));
  }else{
    window.prompt("URL", url);
  }
}

$("shareBtn").addEventListener("click", () => {
  const d = [currentModel.id, +$("sw").value, +$("gw").value, +$("pl").value, $("base").value, $("stripe").value];
  copyText(pageUrl() + "#d=" + b64e(JSON.stringify(d)), $("shareBtn"));
});

const VIEWS = {sim:"viewSim", fav:"viewFav", jour:"viewJour"};
const TABS = {sim:"tabSim", fav:"tabFav", jour:"tabRead"};
function switchTab(view){
  Object.keys(VIEWS).forEach(v => {
    $(VIEWS[v]).classList.toggle("hidden", v !== view);
    $(TABS[v]).classList.toggle("on", v === view);
  });
  if(view === "fav") renderFavs();
}
Object.keys(TABS).forEach(v => $(TABS[v]).addEventListener("click", () => switchTab(v)));

$("addFav").addEventListener("click", () => {
  const maxOrder = favs.reduce((m, f) => Math.max(m, f.order ?? 0), -1);
  favs.push({
    id: Date.now(),
    model: currentModel.id,
    base: $("base").value, stripe: $("stripe").value,
    sw: +$("sw").value, gw: +$("gw").value, pl: +$("pl").value,
    rating: 0,
    order: maxOrder + 1
  });
  saveFavs();
  const btn = $("addFav");
  btn.textContent = "✓ " + t().added;
  setTimeout(() => { btn.textContent = t().addFav; }, 1200);
});

function sortedFavs(){
  const a = favs.slice();
  if(sortMode === 0) a.sort((x,y) => y.rating - x.rating || y.id - x.id);
  else if(sortMode === 1) a.sort((x,y) => y.id - x.id);
  else if(sortMode === 2) a.sort((x,y) => x.id - y.id);
  else if(sortMode === 3) a.sort((x,y) => collator.compare(dispName(x), dispName(y)));
  else if(sortMode === 4) a.sort((x,y) => collator.compare(dispName(y), dispName(x)));
  else a.sort((x,y) => (x.order ?? 0) - (y.order ?? 0));
  return a;
}

function commitManualOrder(arr){
  arr.forEach((f, i) => { f.order = i; });
  saveFavs();
  renderFavs();
}

function startRename(f, nmEl){
  const input = document.createElement("input");
  input.value = dispName(f);
  input.maxLength = 40;
  nmEl.innerHTML = "";
  nmEl.appendChild(input);
  input.focus();
  input.select();
  let done = false;
  const commit = () => {
    if(done) return;
    done = true;
    const v = input.value.trim();
    if(!v || v === (t().models[f.model] || f.model)) delete f.name;
    else f.name = v;
    saveFavs();
    renderFavs();
  };
  input.addEventListener("keydown", e => {
    if(e.key === "Enter") commit();
    if(e.key === "Escape"){ done = true; renderFavs(); }
  });
  input.addEventListener("blur", commit);
  input.addEventListener("click", e => e.stopPropagation());
}

function favRow(f, opts){
  const manual = opts.manual, readonly = opts.readonly;
  const row = document.createElement("div");
  row.className = "fav";

  if(manual && !readonly){
    const grip = document.createElement("span");
    grip.className = "grip";
    grip.textContent = "≡";
    row.appendChild(grip);
    row.draggable = true;
    row.addEventListener("dragstart", e => {
      dragId = f.id;
      e.dataTransfer.effectAllowed = "move";
    });
    row.addEventListener("dragover", e => {
      e.preventDefault();
      row.classList.add("dragover");
    });
    row.addEventListener("dragleave", () => row.classList.remove("dragover"));
    row.addEventListener("drop", e => {
      e.preventDefault();
      row.classList.remove("dragover");
      if(dragId === null || dragId === f.id) return;
      const arr = sortedFavs();
      const from = arr.findIndex(x => x.id === dragId);
      const to = arr.findIndex(x => x.id === f.id);
      const [moved] = arr.splice(from, 1);
      arr.splice(to, 0, moved);
      dragId = null;
      commitManualOrder(arr);
    });
  }

  const sw = document.createElement("div");
  sw.className = "sw";
  sw.style.background = `repeating-linear-gradient(180deg, ${f.stripe} 0 ${f.sw/2}px, ${f.base} ${f.sw/2}px ${(f.sw+f.gw)/2}px)`;
  sw.addEventListener("click", () => loadFav(f));

  const info = document.createElement("div");
  info.className = "info";
  const d = new Date(f.id);
  const pad = n => String(n).padStart(2, "0");
  const nm = document.createElement("p");
  nm.className = "nm";
  const nameSpan = document.createElement("span");
  nameSpan.textContent = dispName(f);
  nm.appendChild(nameSpan);
  if(!readonly){
    const ren = document.createElement("button");
    ren.className = "ren";
    ren.textContent = "✎";
    ren.title = t().rename;
    ren.setAttribute("aria-label", t().rename);
    ren.addEventListener("click", e => {
      e.stopPropagation();
      startRename(f, nm);
    });
    nm.appendChild(ren);
  }
  const sp = document.createElement("p");
  sp.className = "sp";
  sp.textContent = `STRIPE ${f.sw} · GAP ${f.gw} · PLAIN ${f.pl} · ${f.base.toUpperCase()} / ${f.stripe.toUpperCase()}`;
  const dt = document.createElement("p");
  dt.className = "dt";
  dt.textContent = `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  info.appendChild(nm);
  info.appendChild(sp);
  info.appendChild(dt);
  info.addEventListener("click", () => loadFav(f));

  const stars = document.createElement("div");
  stars.className = "stars";
  for(let i = 1; i <= 5; i++){
    if(readonly){
      const st = document.createElement("span");
      st.textContent = i <= f.rating ? "★" : "☆";
      if(i <= f.rating) st.classList.add("on");
      stars.appendChild(st);
    }else{
      const st = document.createElement("button");
      st.textContent = i <= f.rating ? "★" : "☆";
      st.classList.toggle("on", i <= f.rating);
      st.setAttribute("aria-label", `${i}`);
      st.addEventListener("click", () => {
        f.rating = (f.rating === i) ? 0 : i;
        saveFavs();
        renderFavs();
      });
      stars.appendChild(st);
    }
  }

  row.appendChild(sw);
  row.appendChild(info);
  row.appendChild(stars);

  if(manual && !readonly){
    const ud = document.createElement("div");
    ud.className = "ud";
    [["▲", -1], ["▼", 1]].forEach(([sym, dir]) => {
      const b = document.createElement("button");
      b.textContent = sym;
      b.addEventListener("click", () => {
        const arr = sortedFavs();
        const i = arr.findIndex(x => x.id === f.id);
        const j = i + dir;
        if(j < 0 || j >= arr.length) return;
        [arr[i], arr[j]] = [arr[j], arr[i]];
        commitManualOrder(arr);
      });
      ud.appendChild(b);
    });
    row.appendChild(ud);
  }

  if(!readonly){
    const del = document.createElement("button");
    del.className = "del";
    del.textContent = "×";
    del.title = t().del;
    del.setAttribute("aria-label", t().del);
    del.addEventListener("click", () => {
      favs = favs.filter(x => x.id !== f.id);
      saveFavs();
      renderFavs();
    });
    row.appendChild(del);
  }
  return row;
}

function renderFavs(){
  const box = $("favList");
  box.innerHTML = "";
  const shared = sharedFavs !== null;
  $("favTools").classList.toggle("hidden", shared);
  $("sharedBar").classList.toggle("hidden", !shared);
  $("favTitle").textContent = shared ? t().sharedTitle : "favorites";

  if(shared){
    $("sharedMsg").textContent = `${sharedFavs.length}`;
    sharedFavs.forEach(f => box.appendChild(favRow(f, {manual:false, readonly:true})));
    return;
  }
  if(!favs.length){
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = t().empty;
    box.appendChild(p);
    return;
  }
  const manual = sortMode === 5;
  sortedFavs().forEach(f => box.appendChild(favRow(f, {manual, readonly:false})));
}

function loadFav(f){
  const m = MODELS.find(x => x.id === f.model) || MODELS[MODELS.length-1];
  currentModel = m;
  $("base").value = f.base; $("stripe").value = f.stripe;
  $("sw").value = f.sw; $("gw").value = f.gw; $("pl").value = f.pl;
  $("modelSel").value = m.id;
  $("modelNote").textContent = t().notes[m.id];
  captionOverride = f.name || null;
  render();
  switchTab("sim");
}

$("sortSel").addEventListener("change", e => {
  sortMode = +e.target.value;
  renderFavs();
});

function buildSortSel(){
  const sel = $("sortSel");
  sel.innerHTML = "";
  t().sorts.forEach((label, i) => {
    const o = document.createElement("option");
    o.value = i;
    o.textContent = label;
    sel.appendChild(o);
  });
  sel.value = sortMode;
}

$("importBtn").addEventListener("click", () => {
  if(!sharedFavs) return;
  let maxOrder = favs.reduce((m, f) => Math.max(m, f.order ?? 0), -1);
  const now = Date.now();
  sharedFavs.forEach((f, i) => {
    favs.push({
      id: now + i, model: f.model, base: f.base, stripe: f.stripe,
      sw: f.sw, gw: f.gw, pl: f.pl, rating: f.rating || 0,
      ...(f.name ? {name: f.name} : {}),
      order: ++maxOrder
    });
  });
  saveFavs();
  sharedFavs = null;
  renderFavs();
});

$("closeShared").addEventListener("click", () => {
  sharedFavs = null;
  renderFavs();
});

$("dlTeeBtn").addEventListener("click", () => {
  const svgEl = document.querySelector(".stage svg");
  const svgClone = svgEl.cloneNode(true);
  svgClone.setAttribute("width", "540");
  svgClone.setAttribute("height", "540");
  svgClone.setAttribute("xmlns", "http://www.w3.org/2000/svg");

  const svgString = new XMLSerializer().serializeToString(svgClone);
  const svgBlob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(svgBlob);
  const img = new Image();

  img.onload = () => {
    const W = 1080, H = 1350;
    const cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    const ctx = cv.getContext("2d");
    
    // Draw background
    ctx.fillStyle = "#faf9f6";
    ctx.fillRect(0, 0, W, H);

    // Title
    ctx.fillStyle = "#1c1b19";
    ctx.font = "38px 'Hiragino Mincho ProN', 'Yu Mincho', Georgia, serif";
    try { ctx.letterSpacing = "4px"; } catch(e) {}
    ctx.textAlign = "center";
    ctx.fillText(t().posterTitle, W / 2, 160);

    // Divider under title
    ctx.strokeStyle = "#e3e0d8";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(120, 220);
    ctx.lineTo(W - 120, 220);
    ctx.stroke();

    // Draw T-shirt
    ctx.drawImage(img, (W - 540) / 2, 280, 540, 540);

    // Divider under T-shirt
    ctx.beginPath();
    ctx.moveTo(120, 880);
    ctx.lineTo(W - 120, 880);
    ctx.stroke();

    // Text details (left aligned)
    ctx.textAlign = "left";
    try { ctx.letterSpacing = "0px"; } catch(e) {}

    // Model Name
    ctx.fillStyle = "#1c1b19";
    ctx.font = "32px 'Hiragino Mincho ProN', 'Yu Mincho', Georgia, serif";
    const modelText = captionOverride || t().models[currentModel.id];
    ctx.fillText(modelText, 120, 950);

    // Specs
    ctx.fillStyle = "#8e8a82";
    ctx.font = "18px 'Helvetica Neue', Helvetica, sans-serif";
    try { ctx.letterSpacing = "4px"; } catch(e) {}
    const sw = +$("sw").value, gw = +$("gw").value, pl = +$("pl").value;
    ctx.fillText(`STRIPE ${sw} · GAP ${gw} · PLAIN ${pl}`, 120, 1005);

    // Colors
    try { ctx.letterSpacing = "2px"; } catch(e) {}
    const bColor = $("base").value.toUpperCase();
    const sColor = $("stripe").value.toUpperCase();
    ctx.fillText(`${bColor} / ${sColor}`, 120, 1050);

    // Site Credit
    ctx.fillStyle = "#b8b4aa";
    ctx.font = "14px 'Helvetica Neue', Helvetica, sans-serif";
    try { ctx.letterSpacing = "4px"; } catch(e) {}
    ctx.fillText("SHIMA-SHIMA BY SIROP", 120, 1120);
    try { ctx.letterSpacing = "0px"; } catch(e) {}
    ctx.font = "12px 'Helvetica Neue', Helvetica, sans-serif";
    ctx.fillText("sirop-d.github.io/shima-shima", 120, 1145);

    // QR code
    if (typeof qrcode !== "undefined") {
      try {
        const d = [currentModel.id, sw, gw, pl, $("base").value, $("stripe").value];
        const q = qrcode(0, "M");
        q.addData(pageUrl() + "#d=" + b64e(JSON.stringify(d)));
        q.make();
        const n = q.getModuleCount();
        const cell = Math.max(2, Math.floor(180 / n));
        const qs = n * cell;
        const qx = W - 120 - qs;
        const qy = 930;
        
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(qx - 10, qy - 10, qs + 20, qs + 20);
        ctx.fillStyle = "#1c1b19";
        for (let r = 0; r < n; r++) {
          for (let c = 0; c < n; c++) {
            if (q.isDark(r, c)) {
              ctx.fillRect(qx + c * cell, qy + r * cell, cell, cell);
            }
          }
        }
      } catch(e) {
        console.error("QR Code generation failed", e);
      }
    }

    cv.toBlob(blob => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `shima-shima_${currentModel.id}.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    });

    URL.revokeObjectURL(url);
  };

  img.onerror = (err) => {
    console.error("Image load failed", err);
    URL.revokeObjectURL(url);
  };

  img.src = url;
});

function renderJournal(){
  const j = t().journal;
  let html = `<p class="lede">${j.lede}</p>`;
  j.sections.forEach(sec => {
    html += `<h2>${sec.h}</h2>`;
    sec.ps.forEach(p => { html += `<p>${p}</p>`; });
  });
  html += `<h2>${j.iconsH}</h2><ul class="people">`;
  j.icons.forEach(([who, what]) => {
    html += `<li><span class="who">${who}</span><span class="what">${what}</span></li>`;
  });
  html += `</ul><h2>${j.tlH}</h2><ul class="tl">`;
  j.tl.forEach(([y, txt]) => {
    html += `<li><span class="y">${y}</span><span class="t">${txt}</span></li>`;
  });
  html += `</ul><h2>${j.refsH}</h2><p class="src">${j.refs}</p>`;
  $("journal").innerHTML = html;
}

function applyLang(){
  document.documentElement.lang = lang;
  const d = t();
  $("tabSim").textContent = d.nav[0];
  $("tabFav").textContent = d.nav[1];
  $("tabRead").textContent = d.nav[2];
  $("hModel").textContent = d.hModel;
  $("hColor").textContent = d.hColor;
  $("hStripe").textContent = d.hStripe;
  $("lbBase").textContent = d.base;
  $("lbStripe").textContent = d.stripe;
  $("swap").textContent = d.swap;
  $("lbSw").textContent = d.sw;
  $("lbGw").textContent = d.gw;
  $("lbPl").textContent = d.pl;
  $("footnote").textContent = d.footnote;
  $("addFav").textContent = d.addFav;
  $("todayBtn").textContent = d.today;
  $("shareBtn").textContent = d.share;
  $("shareBtn").dataset.label = d.share;
  $("dlTeeBtn").textContent = d.download;
  $("dlTeeBtn").dataset.label = d.download;
  $("importBtn").textContent = d.importFavs;
  $("closeShared").textContent = d.close;
  buildModelSel();
  buildSortSel();
  renderMyColors();
  $("modelNote").textContent = d.notes[currentModel.id];
  $("modelName").textContent = captionOverride || d.models[currentModel.id];
  renderJournal();
  if(!$("viewFav").classList.contains("hidden")) renderFavs();
  try{ localStorage.setItem(KEY_LANG, lang); }catch(e){}
}

$("langSel").addEventListener("change", e => {
  lang = e.target.value;
  applyLang();
});

function saveState(){
  try{
    localStorage.setItem(KEY_STATE, JSON.stringify({
      model: currentModel.id, base: $("base").value, stripe: $("stripe").value,
      sw: $("sw").value, gw: $("gw").value, pl: $("pl").value
    }));
  }catch(e){}
}
function saveFavs(){
  try{ localStorage.setItem(KEY_FAVS, JSON.stringify(favs)); }catch(e){}
}
function saveMyColors(){
  try{ localStorage.setItem(KEY_MYCOLORS, JSON.stringify(myColors)); }catch(e){}
}

function parseHash(){
  const h = location.hash;
  try{
    if(h.startsWith("#d=")){
      const [model, sw, gw, pl, base, stripe] = JSON.parse(b64d(h.slice(3)));
      const m = MODELS.find(x => x.id === model) || MODELS[MODELS.length-1];
      currentModel = m;
      $("base").value = base; $("stripe").value = stripe;
      $("sw").value = sw; $("gw").value = gw; $("pl").value = pl;
      history.replaceState(null, "", pageUrl());
      return "d";
    }
    if(h.startsWith("#f=")){
      sharedFavs = JSON.parse(b64d(h.slice(3))).map((a, i) => ({
        id: Date.now() + i, model: a[0], sw: a[1], gw: a[2], pl: a[3],
        base: a[4], stripe: a[5], rating: a[6] || 0,
        ...(a[7] ? {name: a[7]} : {})
      }));
      history.replaceState(null, "", pageUrl());
      return "f";
    }
  }catch(e){}
  return null;
}

window.addEventListener("hashchange", () => {
  const mode = parseHash();
  if(mode === "d"){ applyModel(currentModel, true); switchTab("sim"); }
  else if(mode === "f"){ switchTab("fav"); }
});

function init(){
  try{ lang = localStorage.getItem(KEY_LANG) || "ja"; }catch(e){}
  if(!I18N[lang]) lang = "ja";
  $("langSel").value = lang;
  try{ favs = JSON.parse(localStorage.getItem(KEY_FAVS)) || []; }catch(e){ favs = []; }
  favs.forEach((f, i) => { if(typeof f.order !== "number") f.order = i; });
  try{ myColors = JSON.parse(localStorage.getItem(KEY_MYCOLORS)) || []; }catch(e){ myColors = []; }

  const hashMode = parseHash();
  let loaded = hashMode === "d";
  if(!loaded){
    try{
      const d = JSON.parse(localStorage.getItem(KEY_STATE));
      if(d){
        currentModel = MODELS.find(x => x.id === d.model) || MODELS[0];
        $("base").value = d.base; $("stripe").value = d.stripe;
        $("sw").value = d.sw; $("gw").value = d.gw; $("pl").value = d.pl;
        loaded = true;
      }
    }catch(e){}
  }
  applyLang();
  if(loaded) applyModel(currentModel, true);
  else applyModel(MODELS[0]);
  if(hashMode === "f") switchTab("fav");
}
init();
</script>
