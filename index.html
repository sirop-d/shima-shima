<style>

*{box-sizing:border-box; margin:0; padding:0;}
html{background:var(--bg);}
body{font-family:var(--sans); color:var(--ink); line-height:1.8; -webkit-font-smoothing:antialiased;}
button{background:none; border:none; cursor:pointer; font:inherit; color:inherit; padding:0;}
select{

header{

.wordmark{font-size:13px; letter-spacing:.38em; font-weight:400;}
.hright{display:flex; align-items:baseline; gap:30px;}
nav{display:flex; gap:26px;}
nav button{

}
nav button.on{color:var(--ink); border-bottom-color:var(--ink);}
#langSel{font-size:10px; letter-spacing:.2em; color:var(--gray);}
main{max-width:1020px; margin:0 auto; padding:64px 48px 80px;}
.sim{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:72px; align-items:start;}
@media (max-width:760px){
  header{padding:24px 24px 20px; flex-wrap:wrap; gap:14px;}
  main{padding:40px 24px 64px;}
  .sim{grid-template-columns:1fr; gap:48px;}
}
.stage svg{display:block; width:100%; max-width:480px; margin:0 auto;}
.caption{text-align:center; margin-top:28px;}
.caption .name{font-family:var(--serif); font-size:15px; letter-spacing:.08em;}
.caption .spec{font-size:10px; letter-spacing:.3em; color:var(--faint); margin-top:6px;}
#addFav{

  border-bottom:1px solid transparent; padding-bottom:2px;
}
#addFav:hover{color:var(--ink); border-bottom-color:var(--ink);}
.ctrl h2{

}
.ctrl section{padding:26px 0; border-bottom:1px solid var(--hairline);}
.ctrl section:first-child{padding-top:0;}
#modelSel{

  border-bottom:1px solid var(--hairline); padding:6px 18px 6px 0;
}
.model-note{font-size:11px; color:var(--faint); margin-top:12px; line-height:1.7;}
.dots{display:flex; flex-wrap:wrap; gap:14px; padding:2px;}
.dots button{
  width:22px; height:22px; border-radius:50%; border:1px solid var(--hairline);
}
.dots button.on{outline:1px solid var(--ink); outline-offset:3px;}
.pickers{display:flex; align-items:center; gap:14px; margin-top:22px;}
.pickers label{font-size:11px; color:var(--gray); letter-spacing:.08em;}
input[type=color]{
  -webkit-appearance:none; appearance:none; width:24px; height:24px; padding:0;
  border:1px solid var(--hairline); border-radius:50%; background:none; cursor:pointer;
}
input[type=color]::-webkit-color-swatch-wrapper{padding:0;}
input[type=color]::-webkit-color-swatch{border:none; border-radius:50%;}
#swap{
  margin-left:auto; font-size:11px; letter-spacing:.14em; color:var(--gray);
  border-bottom:1px solid transparent; padding-bottom:2px;
}
#swap:hover{color:var(--ink); border-bottom-color:var(--ink);}
.slider-row{display:flex; align-items:center; gap:16px; margin:16px 0;}
.slider-row label{font-size:11px; color:var(--gray); letter-spacing:.08em; min-width:64px;}
.slider-row output{font-size:12px; min-width:22px; text-align:right; font-variant-numeric:tabular-nums;}
input[type=range]{
  -webkit-appearance:none; appearance:none; flex:1; height:1px;
  background:var(--hairline); outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:11px; height:11px; border-radius:50%;
  background:var(--ink); border:none; cursor:pointer;
}
input[type=range]::-moz-range-thumb{
  width:11px; height:11px; border-radius:50%; background:var(--ink); border:none; cursor:pointer;
}
.footnote{font-size:10.5px; color:var(--faint); line-height:1.7; padding-top:24px;}
.favhead{display:flex; align-items:baseline; justify-content:space-between; max-width:720px; margin:0 auto 8px;}
.favhead h2{font-size:10px; font-weight:400; letter-spacing:.3em; color:var(--gray); text-transform:uppercase;}
#sortSel{font-size:10.5px; letter-spacing:.12em; color:var(--gray);}
#favList{max-width:720px; margin:0 auto;}
.fav{display:flex; align-items:center; gap:20px; padding:20px 0; border-bottom:1px solid var(--hairline);}
.fav .sw{width:46px; height:46px; border:1px solid var(--hairline); cursor:pointer; flex-shrink:0;}
.fav .info{flex:1; min-width:0; cursor:pointer;}
.fav .nm{font-size:12.5px; letter-spacing:.1em;}
.fav .sp{font-size:9.5px; letter-spacing:.24em; color:var(--faint); margin-top:3px;}
.fav .dt{font-size:9.5px; letter-spacing:.12em; color:var(--faint); margin-top:3px;}
.fav .stars{display:flex; gap:3px;}
.fav .stars button{font-size:13px; color:var(--faint); line-height:1;}
.fav .stars button.on{color:var(--ink);}
.fav .del{font-size:14px; color:var(--faint); padding:0 2px;}
.fav .del:hover{color:var(--ink);}
.empty{max-width:720px; margin:48px auto; text-align:center; font-size:12px; color:var(--faint); letter-spacing:.08em;}
article{max-width:620px; margin:0 auto;}
article .lede{font-family:var(--serif); font-size:16px; line-height:2.2; margin-bottom:48px;}
article h2{

  text-transform:uppercase; margin:56px 0 18px; padding-top:32px; border-top:1px solid var(--hairline);

article h2:first-of-type{margin-top:0; padding-top:0; border-top:none;}
article p{font-family:var(--serif); font-size:14.5px; line-height:2.2; margin-bottom:16px;}
article .people{list-style:none;}
article .people li{margin-bottom:18px;}
article .people .who{font-family:var(--sans); font-size:12px; letter-spacing:.12em; display:block;}
article .people .what{font-family:var(--serif); font-size:13.5px; line-height:2; color:#46443f;}
article .tl{list-style:none;}
article .tl li{display:flex; gap:20px; margin-bottom:14px;}
article .tl .y{font-size:11px; letter-spacing:.1em; color:var(--gray); min-width:64px; padding-top:4px;}
article .tl .t{font-family:var(--serif); font-size:13.5px; line-height:2; flex:1;}
article .src{font-size:11px; color:var(--faint); line-height:1.9;}
article a{color:var(--gray);}
footer{text-align:center; font-size:9px; letter-spacing:.3em; color:var(--faint); padding:48px 0 40px;}
.hidden{display:none;}
</style>
</head>

  </div>
</section>

</section>
</main>

    "bee-russell":"Abeille Russell", "mj":"MJ", "uncl":"UNCL", "original":"Originale"
  },
  notes:{
    "sj-ouessant":"Le grand classique. Jersey épais, rayures régulières sur tout le corps.",
    "sj-naval":"Poitrine unie, rayures fines sur le bas.",
    "sj-morlaix":"Léger, rayures fines — printemps-été.",
    "bee-russell":"Tissu serré, rayures fines, espacement généreux.",
    "mj":"Fond blanc en fil épais. Une rayure nette du quotidien.",
    "uncl":"Rayure standard de tee-shirt, facile à porter.",
    "original":"Réglages libres — trouvez votre propre rayure."
  },
  base:"fond", stripe:"rayure", swap:"inverser",
  sw:"épaisseur", gw:"espacement", pl:"plastron uni",
  footnote:"Les préréglages sont des observations « dans l’esprit de » classiques aimés — aucune spécification officielle d’une marque.",
  addFav:"＋ ajouter aux favoris", added:"ajouté",
  sorts:["par note","récents","anciens"],
  empty:"Pas encore de favoris — enregistrez-en depuis le simulateur.",
  del:"supprimer",
  journal:{
    lede:"La marinière est plus qu’un motif — un vêtement de lignes, passé du dos des marins aux garde-robes de tous les jours. Son histoire, au pas de promenade.",
    sections:[
      {h:"origines", ps:[
        "L’origine remonterait au XVIe siècle, quand les marins du Pays basque portaient des tricots rayés de laine et de coton. Au Japon, on appelle encore ces hauts « chemises basques ».",
        "Plus tard, les marins de Normandie et de Bretagne adoptèrent les rayures pour être repérés en mer par mauvaise visibilité — et la rayure devint la marinière de la Marine nationale. Un motif pratique pour retrouver un camarade tombé à l’eau : c’est là que tout commence."
      ]},
      {h:"vers la mode", ps:[
        "Dans les années 1910, Coco Chanel, inspirée des pêcheurs et des marins, fait entrer la rayure ouvrière dans la mode. En 1923, portée par un artiste, elle déferle sur les stations balnéaires d’Europe et devient synonyme de vacances et de liberté.",
        "La marinière arrive au Japon dans les années 1960 ; le boom du style marin des années 1980–90 en fait un classique du quotidien."
      ]}
    ],
    iconsH:"icônes",
    icons:[
      ["Pablo Picasso","La photographie de Doisneau, avec les petits pains en guise de doigts, est inoubliable. La large rayure noire sur écru s’appelle encore « coloris Picasso »."],
      ["James Dean","Porté par l’icône rebelle, le motif marin gagne un visage urbain."],
      ["Andy Warhol","Lunettes noires et rayures, presque un uniforme — l’art et la marinière définitivement liés."],
      ["Coco Chanel","Elle l’a portée, et c’est elle qui l’a hissée dans la mode."],
      ["Jean Seberg, Brigitte Bardot","Dans les années 1960, avec le cinéma, symbole du chic à la française."],
      ["Jean-Paul Gaultier","Il a fait de la rayure son identité et la protagoniste de ses collections."]
    ],
    tlH:"repères",
    tl:[
      ["1889","Fondation de Saint James, près du Mont-Saint-Michel. Célèbre pour l’Ouessant et le Naval"],
      ["1936","Naissance de Le Minor en Bretagne — tissé et cousu dans ses ateliers français"],
      ["1939","Fondation d’Orcival, ancien fournisseur de la Marine nationale"],
      ["1960s","Saint James arrive au Japon"],
      ["1980–90s","Étincelle du boom marin japonais. MUJI et UNIQLO en font ensuite un basique du quotidien"]
    ],
    refsH:"références",
    refs:'<a href="https://roco2web.com/blogs/koromobito/20240726_165" target="_blank" rel="noopener">Le charme des rayures, aimées dans le monde entier — ROCOCO ONLINE STORE (en japonais)</a><br>Certaines dates et anecdotes restent discutées. Cette page se lit sur le mode du « dit-on ».'
  }
}
};

let lang = "ja";
let currentModel = MODELS[0];
let favs = [];
let sortMode = 0;

function t(){ return I18N[lang]; }

function render(){
  const b = $("base").value, s = $("stripe").value;
  const sw = +$("sw").value, gw = +$("gw").value, pl = +$("pl").value;
  $("st").setAttribute("height", sw + gw);
  $("pBase").setAttribute("height", sw + gw);
  $("pBase").setAttribute("fill", b);
  $("pStripe").setAttribute("height", sw);
  $("pStripe").setAttribute("fill", s);
  $("plainRect").setAttribute("fill", b);
  $("plainRect").setAttribute("height", pl ? 60 + pl : 0);
  $("swOut").textContent = sw;
  $("gwOut").textContent = gw;
  $("plOut").textContent = pl;
  $("specLine").textContent = `STRIPE ${sw} · GAP ${gw} · PLAIN ${pl}`;
  $("modelName").textContent = t().models[currentModel.id];
  markPalette();
  saveState();
}

function markPalette(){
  const b = $("base").value.toUpperCase(), s = $("stripe").value.toUpperCase();
  document.querySelectorAll("#palettes button").forEach((btn, i) => {
    const p = PALETTES[i];
    btn.classList.toggle("on", p.base.toUpperCase() === b && p.stripe.toUpperCase() === s);
  });
}

function applyModel(m, keepValues){
  currentModel = m;
  if(!keepValues){
    $("sw").value = m.sw; $("gw").value = m.gw; $("pl").value = m.pl;
    $("base").value = m.base; $("stripe").value = m.stripe;
  }
  $("modelSel").value = m.id;
  $("modelNote").textContent = t().notes[m.id];
  render();
}

function buildModelSel(){
  const sel = $("modelSel");
  sel.innerHTML = "";
  MODELS.forEach(m => {
    const o = document.createElement("option");
    o.value = m.id;
    o.textContent = t().models[m.id];
    sel.appendChild(o);
  });
  sel.value = currentModel.id;
}

$("modelSel").addEventListener("change", e => {
  applyModel(MODELS.find(m => m.id === e.target.value));
});

const palBox = $("palettes");
PALETTES.forEach(p => {
  const btn = document.createElement("button");
  btn.style.background = `linear-gradient(135deg, ${p.base} 50%, ${p.stripe} 50%)`;
  btn.setAttribute("aria-label", `${p.base} / ${p.stripe}`);
  btn.addEventListener("click", () => {
    $("base").value = p.base;
    $("stripe").value = p.stripe;
    render();
  });
  palBox.appendChild(btn);
});

$("swap").addEventListener("click", () => {
  const b = $("base").value;
  $("base").value = $("stripe").value;
  $("stripe").value = b;
  render();
});

["base","stripe","sw","gw","pl"].forEach(id => $(id).addEventListener("input", render));

const VIEWS = {sim:"viewSim", fav:"viewFav", jour:"viewJour"};
const TABS = {sim:"tabSim", fav:"tabFav", jour:"tabRead"};
function switchTab(view){
  Object.keys(VIEWS).forEach(v => {
    $(VIEWS[v]).classList.toggle("hidden", v !== view);
    $(TABS[v]).classList.toggle("on", v === view);
  });
  if(view === "fav") renderFavs();
}
Object.keys(TABS).forEach(v => $(TABS[v]).addEventListener("click", () => switchTab(v)));

$("addFav").addEventListener("click", () => {
  favs.push({
    id: Date.now(),
    model: currentModel.id,
    base: $("base").value, stripe: $("stripe").value,
    sw: +$("sw").value, gw: +$("gw").value, pl: +$("pl").value,
    rating: 0
  });
  saveFavs();
  const btn = $("addFav");
  btn.textContent = "✓ " + t().added;
  setTimeout(() => { btn.textContent = t().addFav; }, 1200);
});

function sortedFavs(){
  const a = favs.slice();
  if(sortMode === 0) a.sort((x,y) => y.rating - x.rating || y.id - x.id);
  else if(sortMode === 1) a.sort((x,y) => y.id - x.id);
  else a.sort((x,y) => x.id - y.id);
  return a;
}

function renderFavs(){
  const box = $("favList");
  box.innerHTML = "";
  if(!favs.length){
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = t().empty;
    box.appendChild(p);
    return;
  }
  sortedFavs().forEach(f => {
    const row = document.createElement("div");
    row.className = "fav";

    const sw = document.createElement("div");
    sw.className = "sw";
    sw.style.background = `repeating-linear-gradient(180deg, ${f.stripe} 0 ${f.sw/2}px, ${f.base} ${f.sw/2}px ${(f.sw+f.gw)/2}px)`;
    sw.addEventListener("click", () => loadFav(f));

    const info = document.createElement("div");
    info.className = "info";
    const d = new Date(f.id);
    const pad = n => String(n).padStart(2,"0");
    info.innerHTML = `<p class="nm">${t().models[f.model] || f.model}</p>
      <p class="sp">STRIPE ${f.sw} · GAP ${f.gw} · PLAIN ${f.pl} · ${f.base.toUpperCase()} / ${f.stripe.toUpperCase()}</p>
      <p class="dt">${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}</p>`;
    info.addEventListener("click", () => loadFav(f));

    const stars = document.createElement("div");
    stars.className = "stars";
    for(let i = 1; i <= 5; i++){
      const st = document.createElement("button");
      st.textContent = i <= f.rating ? "★" : "☆";
      st.classList.toggle("on", i <= f.rating);
      st.setAttribute("aria-label", `${i}`);
      st.addEventListener("click", () => {
        f.rating = (f.rating === i) ? 0 : i;
        saveFavs();
        renderFavs();
      });
      stars.appendChild(st);
    }

    const del = document.createElement("button");
    del.className = "del";
    del.textContent = "×";
    del.title = t().del;
    del.setAttribute("aria-label", t().del);
    del.addEventListener("click", () => {
      favs = favs.filter(x => x.id !== f.id);
      saveFavs();
      renderFavs();
    });

    row.appendChild(sw);
    row.appendChild(info);
    row.appendChild(stars);
    row.appendChild(del);
    box.appendChild(row);
  });
}

function loadFav(f){
  const m = MODELS.find(x => x.id === f.model) || MODELS[MODELS.length-1];
  currentModel = m;
  $("base").value = f.base; $("stripe").value = f.stripe;
  $("sw").value = f.sw; $("gw").value = f.gw; $("pl").value = f.pl;
  $("modelSel").value = m.id;
  $("modelNote").textContent = t().notes[m.id];
  render();
  switchTab("sim");
}

$("sortSel").addEventListener("change", e => {
  sortMode = +e.target.value;
  renderFavs();
});

function buildSortSel(){
  const sel = $("sortSel");
  sel.innerHTML = "";
  t().sorts.forEach((label, i) => {
    const o = document.createElement("option");
    o.value = i;
    o.textContent = label;
    sel.appendChild(o);
  });
  sel.value = sortMode;
}

function renderJournal(){
  const j = t().journal;
  let html = `<p class="lede">${j.lede}</p>`;
  j.sections.forEach(sec => {
    html += `<h2>${sec.h}</h2>`;
    sec.ps.forEach(p => { html += `<p>${p}</p>`; });
  });
  html += `<h2>${j.iconsH}</h2><ul class="people">`;
  j.icons.forEach(([who, what]) => {
    html += `<li><span class="who">${who}</span><span class="what">${what}</span></li>`;
  });
  html += `</ul><h2>${j.tlH}</h2><ul class="tl">`;
  j.tl.forEach(([y, txt]) => {
    html += `<li><span class="y">${y}</span><span class="t">${txt}</span></li>`;
  });
  html += `</ul><h2>${j.refsH}</h2><p class="src">${j.refs}</p>`;
  $("journal").innerHTML = html;
}

function applyLang(){
  document.documentElement.lang = lang;
  const d = t();
  $("tabSim").textContent = d.nav[0];
  $("tabFav").textContent = d.nav[1];
  $("tabRead").textContent = d.nav[2];
  $("hModel").textContent = d.hModel;
  $("hColor").textContent = d.hColor;
  $("hStripe").textContent = d.hStripe;
  $("lbBase").textContent = d.base;
  $("lbStripe").textContent = d.stripe;
  $("swap").textContent = d.swap;
  $("lbSw").textContent = d.sw;
  $("lbGw").textContent = d.gw;
  $("lbPl").textContent = d.pl;
  $("footnote").textContent = d.footnote;
  $("addFav").textContent = d.addFav;
  buildModelSel();
  buildSortSel();
  $("modelNote").textContent = d.notes[currentModel.id];
  $("modelName").textContent = d.models[currentModel.id];
  renderJournal();
  if(!$("viewFav").classList.contains("hidden")) renderFavs();
  try{ localStorage.setItem(KEY_LANG, lang); }catch(e){}
}

$("langSel").addEventListener("change", e => {
  lang = e.target.value;
  applyLang();
});

function saveState(){
  try{
    localStorage.setItem(KEY_STATE, JSON.stringify({
      model: currentModel.id, base: $("base").value, stripe: $("stripe").value,
      sw: $("sw").value, gw: $("gw").value, pl: $("pl").value
    }));
  }catch(e){}
}
function saveFavs(){
  try{ localStorage.setItem(KEY_FAVS, JSON.stringify(favs)); }catch(e){}
}

function init(){
  try{ lang = localStorage.getItem(KEY_LANG) || "ja"; }catch(e){}
  if(!I18N[lang]) lang = "ja";
  $("langSel").value = lang;
  try{ favs = JSON.parse(localStorage.getItem(KEY_FAVS)) || []; }catch(e){ favs = []; }
  let loaded = false;
  try{
    const d = JSON.parse(localStorage.getItem(KEY_STATE));
    if(d){
      currentModel = MODELS.find(x => x.id === d.model) || MODELS[0];
      $("base").value = d.base; $("stripe").value = d.stripe;
      $("sw").value = d.sw; $("gw").value = d.gw; $("pl").value = d.pl;
      loaded = true;
    }
  }catch(e){}
  applyLang();
  if(loaded) applyModel(currentModel, true);
  else applyModel(MODELS[0]);
}
init();
</script>
</body>
</html>
